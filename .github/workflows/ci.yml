name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/tally_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # No `version` key: the packageManager field in package.json pins pnpm.

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter backend exec prisma generate

      - run: pnpm --filter backend exec prisma migrate deploy

      - run: pnpm lint

      - run: pnpm --filter backend build

      # VITE_SENTRY_DSN is a build-time var: a dummy DSN makes the build behave
      # like production (Sentry bundled), so check:bundle guards the real
      # production payload. No events are actually sent with this placeholder.
      - name: Build frontend (with Sentry, like production)
        env:
          VITE_SENTRY_DSN: https://dummy@ci.ingest.sentry.io/0000000000
        run: pnpm --filter frontend build

      # Phase H9: fail the build if the JS bundle regresses past the budget.
      - run: pnpm --filter frontend check:bundle

      - run: pnpm --filter frontend test

      # Frontend coverage gates (thresholds in frontend/vitest.config.ts).
      - run: pnpm --filter frontend test:coverage

      # Phase H1: the production build must refuse to boot without a JWT_SECRET.
      - name: Fail-fast without JWT_SECRET (production)
        run: |
          if JWT_SECRET= NODE_ENV=production DATABASE_URL=postgresql://test:test@localhost:5432/tally_test node backend/dist/main.js; then
            echo "FAIL: server booted without JWT_SECRET" && exit 1
          else
            echo "PASS: server refused to boot without JWT_SECRET"
          fi

      - run: pnpm test
